<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="fizzbuzz.js"></script>
    <title>FizzBuzz</title>
</head>
<body class="flex justify-center items-center h-screen">
    <div id="container" class="flex items-center justify-between w-[30vw] h-[50%]">
        <form class="w-[30%] h-20">
            <input type="number" id="num" name="num" value="15" class="rounded-full text-center h-full text-lg w-full bg-slate-500">
        </form>
        <button type="button" id="btn" class="bg-slate-700 text-red-500 w-[30%] h-20 p-3 rounded-full">Run FizzBuzz</button>
        <div id="listContainer" class="flex flex-col items-end justify-center w-[30%] max-h-full min-h-20  bg-slate-500 rounded-2xl">
            <ol id="myList" class="hidden w-[90%] my-1 overflow-y-scroll scrollbar-thumb-slate-600 scrollbar-track-slate-100/0"></ol>
        </div>
    </div>
</body>
</html>
